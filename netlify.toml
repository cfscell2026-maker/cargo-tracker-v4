# ============================================================================
#  CARGO TRACKER v4 — Configuration Netlify
#  Hébergement statique de l'application React (apps/web) + en-têtes de sécurité.
#  La logique métier et les données vivent chez Supabase (Edge Functions + PostgreSQL).
# ============================================================================

[build]
  base    = "."
  command = "npm ci && npm run build"
  publish = "apps/web/dist"

[build.environment]
  # L'URL et la clé « anon » Supabase sont PUBLIQUES par conception : une app
  # front les embarque forcément dans le bundle livré au navigateur, la sécurité
  # repose sur les Row Level Security policies côté Postgres, pas sur leur secret.
  # Le scanner de secrets Netlify les repère (bundle + CSP) : on les exclut.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"
  # SEC-02 — Double authentification.
  #
  # ⚠ VOLONTAIREMENT À « false » POUR CE DÉPLOIEMENT.
  #
  # Le code a pour défaut `true` (on ne livre pas une application de données
  # douanières avec la 2FA débranchée par omission). Mais la valeur est forcée
  # ici à `false` le temps de la bascule, pour une raison d'exploitation :
  #   · Netlify déploie le front dès le push sur `main`, donc AVANT que
  #     l'Edge Function ne soit redéployée ;
  #   · aucun des comptes n'a de facteur TOTP enrôlé à ce jour ;
  #   · si le fournisseur TOTP n'est pas activé côté Supabase, l'enrôlement
  #     échoue et PERSONNE ne peut plus entrer.
  # Un front qui exige la 2FA face à un serveur qui ne la connaît pas encore
  # arrêterait le port sec en pleine journée.
  #
  # ÉTAPE 2, une fois les mots de passe changés et les agents accompagnés :
  # passer cette valeur à "true" ET le secret MFA_REQUISE à "true" côté Supabase
  # — les deux ensemble, jamais l'un sans l'autre. Voir EXPLOITATION.md §7.
  VITE_MFA_REQUISE = "false"

# --- SPA : toutes les routes servent index.html (React Router) ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- En-têtes de sécurité (données douanières sensibles) ---
[[headers]]
  for = "/*"
  [headers.values]
    # HTTPS forcé pendant 2 ans, sous-domaines inclus
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # CSP stricte : scripts/styles du site uniquement ; connexions limitées à
    # Supabase (auth + rpc) et Sentry. AUCUN script tiers.
    # NB : remplacer <PROJET> par la référence du projet Supabase au déploiement.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://hwutqjlbzfcjfxvnugnx.supabase.co https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# --- Cache long pour les assets fingerprintés de Vite ---
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
